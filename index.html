<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Armario Lino</title>
<meta name="description" content="Tu armario virtual con IA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Armario">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EFEDE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=DM+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: una columna de móvil (máx. 560px), secciones apiladas, barra de pestañas fija abajo, hoja inferior para editar prendas. */
:root{
  --bg:#EFEDE8; --surface:#F8F7F3; --tile:#E3DED4; --ink:#1C1B19; --muted:#67635B; --line:#D6D0C4;
  --accent:#4E5D2F; --accent-soft:#E3E6D6; --on-ink:#F8F7F3; --danger:#9A3324; --scrim:rgba(28,27,25,.42);
  --display:'Bodoni Moda', Didot, 'Times New Roman', Georgia, serif;
  --body:'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#151412; --surface:#1F1E1B; --tile:#2A2824; --ink:#EFEDE8; --muted:#A39E94; --line:#36332E;
  --accent:#B8C48F; --accent-soft:#2C3122; --on-ink:#151412; --danger:#E08A78; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:560px;margin:0 auto;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:22px}
.eyebrow{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.display{margin:0;font-family:var(--display);font-weight:500;font-size:40px;line-height:1.02;text-wrap:balance}
.display.md{font-size:36px}
.display.sm{font-size:26px;line-height:1.1}
.label{margin:0;font-size:14px;font-weight:500;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.block{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:calc(-1 * max(16px, env(safe-area-inset-right,0px)));padding-right:16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip small{font-size:12px;color:var(--muted);font-weight:400}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.chip[aria-pressed="true"] small{color:var(--on-ink);opacity:.75}
.chip.sm{min-height:36px;border-radius:10px;padding:0 12px;font-size:13px}
.field{width:100%;height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px}
select.field{padding:0 10px}
.btn{min-height:50px;padding:0 20px;border-radius:999px;border:1px solid var(--ink);background:transparent;font-size:15px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--on-ink)}
.btn.wide{width:100%}
.btn.flex{flex:1}
.btn.small{min-height:38px;padding:0 14px;font-size:13px}
.btn.danger{border-color:transparent;color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{width:44px;height:44px;flex:none;border-radius:999px;border:1px solid var(--line);background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.panel{background:var(--surface);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:14px}
.note{margin:0;font-size:14px;color:var(--muted)}
.ai-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:600;white-space:nowrap}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:b 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion: reduce){.dots i{animation:none;opacity:.7}}

.ph{position:relative;border-radius:16px;background:var(--tile);overflow:hidden;aspect-ratio:1/1.05;max-width:100%;display:flex;align-items:center;justify-content:center}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph img.cut{object-fit:contain;padding:8%}
.ph svg{width:58%;height:58%}
.sil path{stroke:var(--ink);stroke-width:.9;stroke-linejoin:round}

.weather{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border-radius:18px;padding:12px 14px}
.weather b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.weather span{font-size:13px;color:var(--muted)}
.look-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.look-grid figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.look-grid figcaption{font-size:13px;font-weight:500;line-height:1.3}
.look-grid figcaption span{display:block;font-weight:400;color:var(--muted);font-size:12px}
.why{display:flex;flex-direction:column;gap:4px}
.why p{margin:0}
.why .eyebrow{color:var(--accent);font-weight:600}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.hist div > span:last-child{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.search input{flex:1;min-width:0;border:none;background:transparent;font-size:16px;outline:none}
.search:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.frow{display:flex;align-items:center;gap:8px;min-width:0}
.frow > .label{width:52px;flex:none;font-size:13px}
.frow .chips{flex:1;min-width:0}
.sw{width:44px;height:44px;flex:none;border:none;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.sw span{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.sw[aria-pressed="true"] span{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.sw.all span{background:conic-gradient(#C19A6B,#2F3E5C,#6F7D4E,#B23A32,#E8C547,#C19A6B)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}
@media (min-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;border:none;background:transparent;padding:0;cursor:pointer;min-width:0}
.card b{font-weight:500;font-size:14px;line-height:1.3}
.card small{font-size:12px;color:var(--muted)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:36px 20px;border:1.5px dashed var(--line);border-radius:24px}
.empty p{margin:0;max-width:32ch}
.fab{position:fixed;right:calc(max(16px, env(safe-area-inset-right,0px)) + 4px);bottom:calc(92px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:none;background:var(--accent);color:var(--bg);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(0,0,0,.25);cursor:pointer;z-index:5}
.fab svg{width:26px;height:26px}
.lote{display:flex;flex-direction:column;max-height:340px;overflow-y:auto}
.litem{display:flex;align-items:center;gap:12px;padding:8px 0;border:none;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%;cursor:default}
button.litem{cursor:pointer}
.lthumb{width:44px;height:44px;flex:none;border-radius:10px;background:var(--tile);overflow:hidden;display:block}
.lthumb img{width:100%;height:100%;object-fit:contain;display:block}
.ltxt{flex:1;min-width:0;display:flex;flex-direction:column}
.ltxt b{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ltxt small{font-size:12px;color:var(--muted)}

.thumbs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:3px}
.thumbs::-webkit-scrollbar{display:none}
.thumb{width:68px;height:68px;flex:none;border-radius:16px;border:2px solid transparent;background:var(--tile);padding:0;overflow:hidden;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb img.cut{object-fit:contain;padding:6px}
.thumb svg{width:60%;height:60%}
.thumb[aria-pressed="true"]{border-color:var(--ink)}
.ideas{display:flex;flex-direction:column;gap:10px}
.idea{background:var(--surface);border-radius:18px;padding:10px;display:flex;align-items:center;gap:12px}
.idea .ph{width:72px;flex:none;aspect-ratio:1}
.idea .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.idea .txt b{font-weight:600;font-size:15px}
.idea .txt span{font-size:13px;color:var(--muted);line-height:1.35}
.gap-card{background:var(--accent-soft);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.gap-title{margin:0;color:var(--accent);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px}

.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.steps a{color:var(--accent);font-weight:600}
.keyrow{display:flex;gap:8px}
.keyrow input{flex:1;min-width:0}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.tabbar div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{min-height:52px;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted);cursor:pointer}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink);font-weight:600}

.sheet-wrap{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:calc(100% - env(safe-area-inset-top,0px) - 12px);overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:26px 26px 0 0;
  padding:18px max(18px, env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px, env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.photo-box{position:relative;border-radius:22px;background:var(--tile);min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden;padding:12px}
.photo-box img{width:100%;max-height:300px;object-fit:contain;display:block}
.photo-box .change{position:absolute;right:10px;bottom:10px;min-height:38px;padding:0 14px;font-size:13px;background:var(--surface);border-color:var(--line)}
.photo-box .bgbtn{position:absolute;left:10px;bottom:10px;min-height:38px;padding:0 14px;font-size:13px;background:var(--surface);border-color:var(--line)}
.photo-box .bgwork{position:absolute;left:10px;right:10px;top:10px;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:var(--surface);font-size:13px;color:var(--muted)}
.photo-box img.working{opacity:.55}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;min-height:44px}
.toggle input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.fieldlbl{display:flex;flex-direction:column;gap:6px}
.fieldlbl > span{font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
fieldset{margin:0;padding:0;border:none;display:flex;flex-direction:column;gap:6px;min-width:0}
legend{padding:0;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
legend b{color:var(--ink);font-weight:600}
.swatches{display:flex;flex-wrap:wrap}
.custom-color{position:relative;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center}
.custom-color span{width:26px;height:26px;border-radius:50%;border:1.5px dashed var(--muted);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--muted)}
.custom-color input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.confirm{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;border:1px solid var(--danger)}
.confirm p{margin:0;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--on-ink);padding:10px 18px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.install{display:flex;flex-direction:column;gap:8px;background:var(--accent-soft);border-radius:18px;padding:14px 16px;font-size:14px}
.install p{margin:0}
</style>
</head>
<body>
<div class="app">
  <main id="v-hoy" class="view" aria-labelledby="h-hoy"></main>
  <main id="v-armario" class="view" aria-labelledby="h-armario" hidden></main>
  <main id="v-comprar" class="view" aria-labelledby="h-comprar" hidden></main>
  <main id="v-ajustes" class="view" aria-labelledby="h-ajustes" hidden></main>
</div>

<button id="fab" class="fab" data-act="nueva" aria-label="Añadir prenda con una foto" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 16a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
</button>

<nav class="tabbar" aria-label="Secciones"><div>
  <button class="tab" data-tab="hoy"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Hoy</button>
  <button class="tab" data-tab="armario"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7a2 2 0 1 1 2 2c-1 0-2 .8-2 2v1M12 12 3 19h18z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Armario</button>
  <button class="tab" data-tab="comprar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2zM9 8a3 3 0 0 1 6 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Comprar</button>
  <button class="tab" data-tab="ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M16 5v4M10 15v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Ajustes</button>
</div></nav>

<div id="sheet" class="sheet-wrap" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="row between">
      <h2 id="sheetTitle" class="display sm">Nueva prenda</h2>
      <button class="iconbtn" data-act="cerrar" aria-label="Cerrar"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </div>
    <div class="photo-box" id="photoBox"></div>
    <input type="file" id="edFile" accept="image/*" class="sr" aria-label="Foto de la prenda">
    <p id="aiStatus" class="note" hidden></p>
    <label class="fieldlbl"><span>Nombre</span><input id="edNombre" class="field" placeholder="Ej. Chaqueta vaquera azul" autocomplete="off"></label>
    <div class="two">
      <label class="fieldlbl"><span>Tipo</span><select id="edTipo" class="field"></select></label>
      <label class="fieldlbl"><span>Marca</span><input id="edMarca" class="field" placeholder="Opcional" autocomplete="off"></label>
    </div>
    <fieldset>
      <legend>Color: <b id="edColorName">Sin elegir</b> <span id="edColorBy"></span></legend>
      <div class="swatches" id="edSwatches"></div>
    </fieldset>
    <div class="two">
      <label class="fieldlbl"><span>Estilo</span><select id="edEstilo" class="field"></select></label>
      <label class="fieldlbl"><span>Temporada</span><select id="edTemporada" class="field"></select></label>
    </div>
    <button class="btn primary wide" id="btnGuardar" data-act="guardar">Guardar prenda</button>
    <div id="delZone"></div>
  </div>
</div>

<input type="file" id="loteFile" accept="image/*" multiple class="sr" aria-label="Fotos de varias prendas">
<input type="file" id="impFile" accept="application/json,.json" class="sr" aria-label="Archivo de copia de seguridad">
<div id="toast" class="toast" role="status" hidden></div>

  shirt:"M11 4 L7 6 L3 11 L7 14 L9 12 L9 28 L23 28 L23 12 L25 14 L29 11 L25 6 L21 4 L16 9 Z M16 9 V28",
  pants:"M9 3 H23 L25 29 H19 L16 12 L13 29 H7 Z",

  skirt:"M10 5 H22 L27 28 H5 Z",

function tx(store,mode,fn){return new Promise(function(res,rej){
  var t=idb.transaction(store,mode),s=t.objectStore(store),req=fn(s);

})}

/* ================= IA (Gemini) ================= */
var API="https://generativelanguage.googleapis.com/v1beta";
function clave(){return lsGet("al_key","")}
function hayIA(){return !!clave()}
function modelos(){
  var c=lsGet("al_models",null);
  if(c&&c.k===clave().slice(-6)&&Date.now()-c.t<864e5&&c.list.length)return Promise.resolve(c.list);
  var todosM=[];
  function pagina(tok){
    return fetch(API+"/models?pageSize=1000"+(tok?"&pageToken="+encodeURIComponent(tok):""),{headers:{"x-goog-api-key":clave()}}).then(function(r){
      if(r.status===400||r.status===401||r.status===403)throw {code:"clave"};
      if(!r.ok)throw {code:"red"};return r.json();
    }).then(function(j){
      todosM=todosM.concat(j.models||[]);
      if(j.nextPageToken&&todosM.length<3000)return pagina(j.nextPageToken);
    });
  }
  return pagina("").then(function(){
    var ver=function(n){var m=n.match(/gemini-(\d+(?:\.\d+)?)/);return m?parseFloat(m[1]):0};
    var ok=todosM.filter(function(m){var g=m.supportedGenerationMethods;return !g||g.indexOf("generateContent")>=0}).map(function(m){return String(m.name||"").replace(/^models\//,"")});
    var porVer=function(a,b){return ver(b)-ver(a)};
    var flash=ok.filter(function(n){return /^gemini-\d+(\.\d+)?-flash$/.test(n)}).sort(porVer);
    var latest=ok.filter(function(n){return n==="gemini-flash-latest"});
    var lite=ok.filter(function(n){return /^gemini-\d+(\.\d+)?-flash-lite$/.test(n)||n==="gemini-flash-lite-latest"}).sort(porVer);
    var prev=ok.filter(function(n){return /^gemini-\d+(\.\d+)?-flash(-lite)?-preview$/.test(n)}).sort(porVer);
    var list=flash.slice(0,2).concat(latest,lite.slice(0,2),prev.slice(0,1));
    lsSet("al_models",{k:clave().slice(-6),t:Date.now(),list:list});return list;
  });
}
function blobA64(blob){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(String(fr.result).split(",")[1])};fr.onerror=rej;fr.readAsDataURL(blob)})}
function leerJSON(t){
  t=String(t||"").trim();
  try{return JSON.parse(t)}catch(e){}
  var m=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(m){try{return JSON.parse(m[1])}catch(e){}}
  var a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]"));
  if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}
  throw {code:"json"};
}
function preguntarIA(prompt,imagen,signal,temp){
  if(!hayIA())return Promise.reject({code:"sin_clave"});
  var temperatura=typeof temp==="number"?temp:0.9;
  var partsP=imagen?blobA64(imagen).then(function(d){return [{text:prompt},{inline_data:{mime_type:imagen.type||"image/jpeg",data:d}}]}):Promise.resolve([{text:prompt}]);
  var listaP=modelos().catch(function(e){if(e&&e.code==="clave")throw e;return []});
  return Promise.all([listaP,partsP]).then(function(r){
    var list=r[0].slice(),parts=r[1],i=0,errores=[],retirados=lsGet("al_retirados",[]);
    RESERVA.forEach(function(m){if(list.indexOf(m)<0)list.push(m)});
    list=list.filter(function(m){return retirados.indexOf(m)<0});
    if(!list.length)list=RESERVA.slice();
    function peor(){
      // Devuelve el error más útil: primero clave, luego límite, luego cualquiera que no sea "modelo retirado".
      var orden=["clave","limite","peticion","vacio","json","red"];
      var no404=errores.filter(function(e){return !e.retirado});
      var base=(no404.length?no404:errores).slice().sort(function(a,b){return orden.indexOf(a.code)-orden.indexOf(b.code)})[0]||{code:"red"};
      base.detalle=(base.detalle||"")+(errores.length>1?" (probados: "+errores.map(function(e){return e.modelo}).join(", ")+")":"");
      return base;
    }
    function siguiente(err){
      errores.push(err);
      if(err.retirado){
        if(retirados.indexOf(err.modelo)<0){retirados.push(err.modelo);lsSet("al_retirados",retirados)}
        lsDel("al_models");if(lsGet("al_ok_model","")===err.modelo)lsDel("al_ok_model");
        var sug=(err.msg||"").match(/models\/(gemini-[a-z0-9.\-]+)/gi)||[];
        sug.forEach(function(s){var n=s.replace(/^models\//i,"");if(n!==err.modelo&&list.indexOf(n)<0&&retirados.indexOf(n)<0)list.splice(i+1,0,n)});
      }
      i++;if(i<list.length&&i<9)return intento();throw peor();
    }
    function intento(){
      var m=list[i];
      return fetch(API+"/models/"+encodeURIComponent(m)+":generateContent",{method:"POST",signal:signal,
        headers:{"Content-Type":"application/json","x-goog-api-key":clave()},
        body:JSON.stringify({contents:[{role:"user",parts:parts}],generationConfig:{responseMimeType:"application/json",temperature:temperatura}})
      }).then(function(res){
        return res.text().then(function(body){
          var j=null;try{j=JSON.parse(body)}catch(x){}
          if(!res.ok){
            var msg=(j&&j.error&&j.error.message)||body.slice(0,200);
            var err={code:"red",modelo:m,msg:msg,detalle:m+" · "+res.status+" · "+String(msg).slice(0,160)};
            if((res.status===400||res.status===401||res.status===403)&&/API key|API_KEY|PERMISSION_DENIED|permission/i.test(msg)){err.code="clave";throw err}
            if(res.status===404||/no longer available|not found|is not supported for generateContent/i.test(msg))err.retirado=true;
            else if(res.status===429)err.code="limite";else if(res.status===400)err.code="peticion";
            return siguiente(err);
          }
          var c=j&&j.candidates&&j.candidates[0];
          var t=c&&c.content&&c.content.parts?c.content.parts.map(function(p){return p.thought?"":(p.text||"")}).join(""):"";
          if(!t)return siguiente({code:"vacio",modelo:m,detalle:m+" · sin texto"+(c&&c.finishReason?" ("+c.finishReason+")":"")});
          try{var out=leerJSON(t);lsSet("al_ok_model",m);return out}catch(x){return siguiente({code:"json",modelo:m,detalle:m+" · respuesta no válida"})}
        });
      });
    }
    var ok=lsGet("al_ok_model","");if(ok&&list.indexOf(ok)>0){list.splice(list.indexOf(ok),1);list.unshift(ok)}
    return intento();
  }).catch(function(e){
    if(e&&e.name==="AbortError")throw {code:"cancelado"};
    if(e&&e.code)throw e;
    throw {code:"red",detalle:String(e&&e.message||e||"")};
  });
}
var RESERVA=["gemini-flash-latest","gemini-3.8-flash","gemini-3.6-flash","gemini-3.5-flash-lite","gemini-flash-lite-latest","gemini-2.5-flash"];
function probarIA(){
  st.keyState="loading";st.keyMsg="";render();

function iaErr(e){var c=e&&e.code;
  if(c==="cancelado")return "";
  if(c==="sin_clave")return "Conecta la IA en Ajustes para usar esta función.";
  if(c==="clave")return "La clave de Gemini no funciona. Revísala en Ajustes.";
  if(c==="limite")return "Has llegado al límite gratuito de la IA por ahora. Prueba en un rato.";
  if(c==="json"||c==="vacio")return "La respuesta de la IA no salió bien. Pulsa otra vez.";
  if(c==="peticion")return "La IA no ha podido procesar esto. Prueba otra vez o con otra foto.";
  return navigator.onLine===false?"No tienes conexión a internet ahora mismo.":"No se pudo conectar con la IA. Prueba otra vez en un momento.";
}

function rangoDe(t){return TIEMPOS.filter(function(x){return x[0]===t})[0][1]}
function cargarTiempo(pedido){
  if(!navigator.geolocation){if(pedido)toast("Este móvil no permite saber la ubicación.");return}
  st.meteoState="loading";render();
  navigator.geolocation.getCurrentPosition(function(pos){
    var u="https://api.open-meteo.com/v1/forecast?latitude="+pos.coords.latitude.toFixed(3)+"&longitude="+pos.coords.longitude.toFixed(3)+
      "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&current=temperature_2m&timezone=auto&forecast_days=1";
    fetch(u).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
      var max=Math.round(d.daily.temperature_2m_max[0]),min=Math.round(d.daily.temperature_2m_min[0]);
      var pp=d.daily.precipitation_probability_max?d.daily.precipitation_probability_max[0]:0;
      var now=d.current&&d.current.temperature_2m!=null?Math.round(d.current.temperature_2m):null;
      st.meteo={max:max,min:min,pp:pp||0,now:now};
      st.tiempo=max<10?"Frío":max<18?"Fresco":max<25?"Templado":"Calor";
      st.lluvia=(pp||0)>=50;st.meteoState="ok";lsSet("al_geo",true);render();
    }).catch(function(){st.meteoState="error";render()});
  },function(err){
    st.meteoState=err&&err.code===1?"denegado":"error";if(err&&err.code===1)lsDel("al_geo");render();
  },{timeout:12000,maximumAge:30*60*1000});
}

/* ================= acciones de IA ================= */
function linea(p){return [p.id,p.tipo,p.nombre,p.color||"-",p.marca||"-",p.estilo||"-",p.temporada||"-",p.ultimoUso?"usada "+hace(p.ultimoUso):"sin usar aún"].join(" | ")}
function armarioTexto(excluir){return prendas.filter(function(p){return p.id!==excluir}).slice(0,400).map(linea).join("\n")}
function tiempoTexto(){
  var t=st.tiempo+" ("+rangoDe(st.tiempo)+")";
  if(st.meteo)t+=", hoy mínima "+st.meteo.min+"° y máxima "+st.meteo.max+"°, "+st.meteo.pp+"% de probabilidad de lluvia";
  if(st.lluvia)t+=", y llueve";
  return t;
}
var lookCtl=null;
function crearLook(otra){
  if(st.lookState==="loading")return;
  if(otra&&st.look)st.previas.push(st.look.prendas.join(","));
  if(!otra)st.previas=[];
  var rec=looks.slice(0,6).map(function(l){return "- "+hace(l.fecha)+": "+(l.prendas||[]).map(function(id){var p=byId(id);return p?p.nombre:id}).join(", ")}).join("\n");
  var prompt="Eres un estilista personal con muy buen gusto. Crea UN outfit bonito, coherente y adecuado usando SOLO prendas de este armario.\n\n"+
    "Plan de hoy: "+st.plan+(st.detalle.trim()?". Detalles: "+st.detalle.trim():"")+"\n"+
    "Tiempo: "+tiempoTexto()+"\n\n"+
    "Armario (id | tipo | nombre | color | marca | estilo | temporada | último uso):\n"+armarioTexto()+"\n\n"+
    (rec?"Looks recientes (no los repitas):\n"+rec+"\n\n":"")+
    (st.previas.length?"Ya propuse estas combinaciones de ids y quiero una claramente distinta:\n"+st.previas.join("\n")+"\n\n":"")+
    "Reglas:\n- Usa solo ids de la lista, copiados tal cual.\n- Incluye parte de arriba y parte de abajo (o un vestido) y calzado, si los hay.\n- Si hace frío o fresco, o llueve, añade una capa de abrigo adecuada si la hay. Con calor, nada de capas pesadas.\n- Que los colores combinen con armonía y que el estilo encaje con el plan (más formal para trabajo, más arreglado para cena, cita o fiesta, deportivo para deporte, cómodo para relax o viaje).\n- Puedes añadir una gorra o un complemento si suma al look. No incluyas calcetines ni ropa interior.\n- Prioriza prendas que no se han usado recientemente.\n- Si al armario le falta algo importante para este plan o este tiempo, dilo brevemente en \"falta\"; si no, déjalo vacío.\n\n"+
    "Responde SOLO con este JSON, en español:\n{\"titulo\":\"nombre del look en 2 a 5 palabras\",\"prendas\":[\"id\",\"id\"],\"porQue\":\"2 frases sobre por qué funciona para este plan y este tiempo\",\"consejo\":\"un consejo breve de cómo llevarlo\",\"falta\":\"\"}";
  st.lookState="loading";render();
  if(lookCtl)lookCtl.abort();lookCtl=new AbortController();
  preguntarIA(prompt,null,lookCtl.signal).then(function(r){
    var ids=(r&&Array.isArray(r.prendas)?r.prendas:[]).map(String).filter(function(id,i,a){return byId(id)&&a.indexOf(id)===i});
    if(!ids.length)throw {code:"json"};
    st.look={titulo:String(r.titulo||"Tu look"),prendas:ids,porQue:String(r.porQue||""),consejo:String(r.consejo||""),falta:String(r.falta||""),plan:st.plan,tiempo:st.tiempo+(st.lluvia?" y lluvia":"")};
    st.lookState="done";
  }).catch(function(e){st.lookMsg=iaErr(e);st.lookState=st.lookMsg?"error":"idle"}).then(render);
}
function ponerse(){
  var L=st.look;if(!L||L.guardado)return;
  var ahora=new Date().toISOString();
  guardarObj("looks",{id:nuevoId(),fecha:ahora,plan:L.plan,tiempo:L.tiempo,titulo:L.titulo,prendas:L.prendas}).then(function(){
    return Promise.all(L.prendas.map(function(id){var p=byId(id);if(!p)return null;p.ultimoUso=ahora;return guardarObj("prendas",p)}));
  }).then(function(){L.guardado=true;toast("Look guardado. ¡A por el día!");return recargar()})
  .catch(function(){toast("No se pudo guardar el look. Prueba otra vez.")});
}
function normIdeas(arr){return (Array.isArray(arr)?arr:[]).slice(0,5).map(function(i){return {nombre:String(i.nombre||""),tipo:TIPOS.indexOf(i.tipo)>=0?i.tipo:"Complemento",colorHex:safeHex(i.colorHex),porQue:String(i.porQue||""),busqueda:String(i.busqueda||i.nombre||"")}}).filter(function(i){return i.nombre})}
function pedirFaltan(){
  st.faltanState="loading";render();
  var prompt="Eres estilista personal. Este es mi armario (id | tipo | nombre | color | marca | estilo | temporada | último uso):\n"+armarioTexto()+
    "\n\nDime entre 3 y 4 prendas o complementos clave que me faltan para poder crear más looks y cubrir planes como trabajo, cena, deporte, frío y calor. Que encajen con el estilo que ya tengo y combinen con muchas de mis prendas. No propongas cosas que ya tengo.\n\n"+
    "Responde SOLO con JSON, en español:\n{\"faltan\":[{\"nombre\":\"nombre corto\",\"tipo\":\"uno de: "+TIPOS.join(", ")+"\",\"colorHex\":\"#RRGGBB\",\"porQue\":\"una frase: por qué la necesito y con qué de mi armario combina\",\"busqueda\":\"texto para buscar en una tienda online\"}]}";
  preguntarIA(prompt).then(function(r){st.faltan=normIdeas(r&&r.faltan);if(st.faltan.length)st.faltanState="done";else{st.faltanState="error";st.faltanMsg="No he encontrado ideas. Prueba otra vez."}})
  .catch(function(e){st.faltanMsg=iaErr(e);st.faltanState=st.faltanMsg?"error":"idle"}).then(render);
}
var ideasCtl=null;
function pedirIdeas(id){
  var p=byId(id);if(!p)return;
  if(ideasCtl)ideasCtl.abort();
  st.sel=id;st.ideas=null;st.ideasState="loading";render();
  ideasCtl=new AbortController();
  var prompt="Eres estilista personal. Prenda elegida: "+linea(p)+"\n\nResto de mi armario (id | tipo | nombre | color | marca | estilo | temporada | último uso):\n"+(armarioTexto(id)||"(vacío)")+
    "\n\nPropón 4 prendas o complementos para COMPRAR que combinen muy bien con la prenda elegida y que no tenga ya. Ten en cuenta colores, estilo y temporada, y que también combinen con otras prendas de mi armario.\n\n"+
    "Responde SOLO con JSON, en español:\n{\"ideas\":[{\"nombre\":\"nombre corto\",\"tipo\":\"uno de: "+TIPOS.join(", ")+"\",\"colorHex\":\"#RRGGBB\",\"porQue\":\"una frase sobre por qué combina\",\"busqueda\":\"texto para buscar en una tienda online\"}]}";
  preguntarIA(prompt,null,ideasCtl.signal).then(function(r){if(st.sel!==id)return;st.ideas=normIdeas(r&&r.ideas);st.ideasState="done"})
  .catch(function(e){if(st.sel!==id)return;st.ideasMsg=iaErr(e);st.ideasState=st.ideasMsg?"error":"idle"}).then(render);
}
function guardarClave(){
  var val=($("#keyIn").value||"").trim();
  if(!val){st.keyState="error";st.keyMsg="Pega primero la clave.";render();return}
  var anterior=clave();
  lsSet("al_key",val);lsDel("al_models");lsDel("al_retirados");
  st.keyState="loading";st.keyMsg="";render();
  lsDel("al_ok_model");
  modelos().then(function(){probarIA()})
  .catch(function(e){
    if(e&&e.code==="clave"){if(anterior)lsSet("al_key",anterior);else lsDel("al_key");st.keyState="error";st.keyMsg="Esa clave no funciona. Revisa que la hayas copiado entera."}
    else{st.keyState="ok";st.keyMsg="Clave guardada. No he podido comprobarla ahora (¿sin conexión?)."}
    render();
  });
}

    case "sel":pedirIdeas(a.dataset.id);break;
    case "guardarClave":guardarClave();break;
    case "quitarClave":lsDel("al_key");lsDel("al_models");lsDel("al_retirados");st.keyState="idle";st.keyMsg="Clave eliminada.";render();break;
    case "exportar":exportar();break;
    case "importar":$("#impFile").click();break;
    case "ocultarInstalar":lsSet("al_hide_install",true);render();break;
  }
});
document.addEventListener("input",function(e){
  if(e.target.id==="detalle")st.detalle=e.target.value;
  else if(e.target.id==="q"){st.q=e.target.value;renderArmario()}
  else if(e.target.id==="edCustom"&&ed){ed.colorHex=e.target.value;ed.color="Personalizado";ed.colorBy="tu";$("#edColorName").textContent="Personalizado"}
});
document.addEventListener("change",function(e){
  if(e.target.id==="edFile"){onFoto(e.target.files&&e.target.files[0]);e.target.value=""}
  else if(e.target.id==="edCustom"&&ed)renderColores();
  else if(e.target.id==="autoBg"){lsSet("al_auto_bg",e.target.checked)}
  else if(e.target.id==="loteFile"){var fs=e.target.files;iniciarLote(fs);e.target.value=""}
  else if(e.target.id==="impFile"){importar(e.target.files&&e.target.files[0]);e.target.value=""}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&!$("#sheet").hidden)cerrarEditor();
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches('label[for="edFile"]')){e.preventDefault();$("#edFile").click()}
});
$("#sheet").addEventListener("click",function(e){if(e.target.id==="sheet")cerrarEditor()});
window.addEventListener("hashchange",function(){setTab(location.hash.slice(1))});

/* ================= arranque ================= */
setTab(location.hash.slice(1)||"hoy");
abrirDB().then(function(d){idb=d;return recargar()}).catch(function(){
  listo=true;render();toast("No se pudo abrir el almacenamiento del iPhone. Revisa que no estés en navegación privada.");
});
if(lsGet("al_geo",false))cargarTiempo(false);
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
})();
</script>
</body>
